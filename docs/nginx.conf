# FarNVR za externím nginx (TLS ukončené na nginx, např. certifikát Let's Encrypt)
# Nahraďte nvr.example.cz a 192.0.2.50:8090 (NVR_BIND:NVR_PORT serveru s FarNVR).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nvr.example.cz;

    ssl_certificate     /etc/letsencrypt/live/nvr.example.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nvr.example.cz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://192.0.2.50:8090;
        proxy_http_version 1.1;

        # Host musí projít beze změny (kontrola Origin u živého obrazu)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket – živý obraz
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Video a export do MP4: bez bufferování a s dlouhými timeouty
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name nvr.example.cz;
    return 301 https://$host$request_uri;
}
