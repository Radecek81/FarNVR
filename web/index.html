<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <title>FarNVR</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/hls.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#live"><img src="/icon.svg" alt="" width="26" height="26"><span class="brand-name">FarNVR</span></a>
    <nav>
      <a href="#live" data-i18n="nav.live"></a>
      <a href="#playback" data-i18n="nav.playback"></a>
      <a href="#settings" data-i18n="nav.settings"></a>
    </nav>
    <span class="spacer"></span>
    <span class="health badge err" hidden></span>
    <span class="clock"></span>
    <button type="button" class="btn ghost" data-act="logout" data-i18n="nav.logout"></button>
  </header>
  <main>
    <section id="view-live" class="view"></section>
    <section id="view-playback" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>
  <footer class="credit">FarNVR © Uberit s.r.o. · <a href="https://github.com/Radecek81/FarNVR" rel="noopener">AGPL-3.0</a></footer>
</body>
</html>
